  - '### Diet and feeding behavior'
  - 'Tyrannosaurs had large olfactory bulbs and olfactory nerves (relative to their
    brain size). These suggest a highly developed sense of smell which could sniff
    out carcasses over great distances, as modern vultures do. Research on the olfactory
    bulbs of dinosaurs has shown that Tyrannosaurus had the most highly developed
    sense of smell of 21 sampled dinosaurs.

    Tyrannosaur teeth could crush bone, and therefore could extract as much food (bone
    marrow) as possible from carcass remnants, usually the least nutritious parts.
    Karen Chin and colleagues have found bone fragments in coprolites (fossilized
    feces) that they attribute to tyrannosaurs, but point out that a tyrannosaur''s
    teeth were not well adapted to systematically chewing bone like hyenas do to extract
    marrow.'
  - the origin of the deltoid or teres major muscles. The presence of avulsion injuries
    being limited to the forelimb and shoulder in both Tyrannosaurus and Allosaurus
    suggests that theropods may have had a musculature more complex than and functionally
    different from those of birds. The researchers concluded that Sue's tendon avulsion
    was probably obtained from struggling prey. The presence of stress fractures and
    tendon avulsions, in general, provides evidence for a "very active" predation-based
    diet rather than obligate scavenging.
  respuesta: Comí restos de animales muertos, como huesos y carne. Mi sentido del
    olfato era muy fuerte, así que podía encontrar cadáveres a grandes distancias.
  veredicto_humano: true
