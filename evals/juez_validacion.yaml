    hut fast going to decay, and one very small old lady with a hooked'
  - 'V


    THE LITTLE HOUSE


    Everybody has heard of the Little House in the Kensington Gardens,

    which is the only house in the whole world that the fairies have built

    for humans.  But no one has really seen it, except just three or four,

    and they have not only seen it but slept in it, and unless you sleep in

    it you never see it.  This is because it is not there when you lie

    down, but it is there when you wake up and step outside.'
  - 'Of all delectable islands the Neverland is the snuggest and most

    compact, not large and sprawly, you know, with tedious distances

    between one adventure and another, but nicely crammed. When you play at

    it by day with the chairs and table-cloth, it is not in the least

    alarming, but in the two minutes before you go to sleep it becomes very

    real. That is why there are night-lights.'
  respuesta: Vivo en la Isla del Nunca, que es un lugar muy especial y mágico.
