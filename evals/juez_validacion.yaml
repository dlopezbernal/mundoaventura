  - 'He was born on Saturday, April 15, 1452, “at the third hour of the night,” that
    is, three hours after the Hail Mary: at 10:30 p.m.​ It has been debated whether
    his birth took place at the castle in Vinci—a town about 25 km as the crow flies
    from Florence—or at his mother’s home in Anchiano, a hamlet about two kilometers
    from Vinci.​ Leonardo, a descendant of a wealthy family of Italian nobles, was
    born out of wedlock: his father, Messer Piero Fruosino di Antonio (notary, chancellor,
    and ambassador of the Republic of Florence), impregnated Caterina, a young woman
    from a peasant family,​​ who has been suspected of having been a Circassian slave
    from the Middle East, from the Caucasus Mountains.​​ Martin Kemp, professor emeritus
    of art history at the University of Oxford, after researching'
  - '## Biography


    ### Childhood'
  - '# Leonardo da Vinci


    Leonardo da Vinci was an artist and inventor from the Renaissance. He was born
    in 1452

    in the town of Vinci, in Italy, and he died in 1519.


    He painted very famous works, such as the Mona Lisa (La Gioconda) and The Last
    Supper.

    He filled notebooks with inventions ahead of his time: flying machines, a kind
    of

    helicopter, and even a parachute.


    He loved studying nature: water, light, birds and the human body. For him, art
    and science

    went together. He wrote many notes backwards, in mirror writing, which is read
    with a

    mirror. He was very curious and always asked himself questions about how everything
    he saw

    worked.'
  respuesta: Nací el sábado 15 de abril de 1452, a las 10:30 de la noche.
  veredicto_humano: true
