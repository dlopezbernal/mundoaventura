  - '## Work


    ### Painting'
  - Between 1503 and 1506, he worked on a small portrait, *La Gioconda*, likely the
    most famous painting in Western art. The work depicts Lisa Gherardini, wife of
    Francesco del Giocondo. It was a painting very dear to Leonardo, and he kept it
    with him until his death. Its current appearance is deceptive due to a thick layer
    of darkened varnishes, the removal of which is being delayed because of the risks
    involved. Despite this, the painting is in an unusually good state of preservation,
    as it shows no visible signs of repairs, overpainting, or retouching—a very rare
    occurrence for a painting from this period.
  - Another notable work is *The Virgin, the Infant Jesus, and Saint Anne*, painted
    around 1510, which has been copied many times. The work influenced Michelangelo,
    Raphael, and Andrea del Sarto in particular, and through them, Pontormo and Antonio
    da Correggio. The compositional style was adopted in particular by Venetian painters
    such as Tintoretto and Paolo Veronese. One of Leonardo’s last paintings was that
    of Saint John the Baptist, for which he used Salai as a model.​
  respuesta: Pinté muchos cuadros, pero no puedo contarlos todos. ¡Eso sería un trabajo
    muy difícil!
  veredicto_humano: false
