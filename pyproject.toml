[project]
name = "mundoaventura-backend"
version = "0.3.0"
description = "Backend de IA (FastAPI) de MundoAventura: escena (Replicate) + chat RAG por personaje."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Dependencias del backend (antes en requirements-backend.txt). Las cotas son
# deliberadamente conservadoras: chromadb y langchain-text-splitters rompen la
# API entre menores, así que se acotan por minor. El pin EXACTO (con hashes de
# todas las transitivas) vive en uv.lock, que es lo que garantiza el "clona y
# arranca" reproducible: `uv sync` instala exactamente lo del lockfile.
dependencies = [
    # --- Generación de imágenes y conversación (en la nube) ---
    "replicate>=1.0,<2",
    # --- Configuración editable en caliente (menú de ajustes) ---
    "sqlmodel>=0.0.39,<0.1",
    # --- Conversación / RAG ---
    "chromadb>=1.5,<2",
    "deepl>=1.30,<2",
    "elevenlabs>=2.0,<3.0",
    # --- Ingesta de documentos ---
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6.0,<7",
    "wikipedia-api>=0.15,<0.16",
    # --- Servidor web / API ---
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.48,<0.49",
    "python-multipart>=0.0.20,<0.1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.0,<2",
    # `services/resiliencia.py` captura httpx.TransportError para decidir qué
    # errores merecen reintento. Es una dependencia de PRODUCCIÓN, aunque los
    # tres SDKs (replicate, elevenlabs, openai) ya la arrastren: apoyarse en una
    # dependencia transitiva es apoyarse en que nadie la cambie nunca.
    "httpx>=0.28,<0.29",
    "slowapi>=0.1.10",
    "lingua-language-detector>=2.2.0",
    "pyphen>=0.17.2",
    "fastembed>=0.8.0",
    "openai>=1.0,<2",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
]

[project.optional-dependencies]
# STT local (Hito 7): faster-whisper (CTranslate2, SIN torch) transcribe la voz del
# niño EN EL PROPIO PC. Es OPCIONAL a propósito: un `uv sync` normal queda ligero y
# usa el STT de nube (elevenlabs), reproduciendo la línea base; quien quiera STT local
# instala este extra con `uv sync --extra stt-local` y añade las DLLs de cuBLAS/cuDNN
# (ver README). Si no está o no carga, stt_service cae a la nube — la app no se queda muda.
stt-local = [
    "faster-whisper>=1.0,<2",
]

[dependency-groups]
# Herramientas de desarrollo. Se instalan con `uv sync` (uv incluye los
# dependency-groups por defecto) y quedan disponibles con `uv run ruff ...`,
# `uv run pytest ...`. OJO: el despliegue usa `uv sync --frozen` sin `--no-dev`,
# así que HOY también acaban en el servidor. Es inofensivo (son unos MB) y
# deliberado por ahora: mantiene el .venv del VPS idéntico al de desarrollo, y
# permite lanzar la suite allí si hace falta diagnosticar algo.
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.14,<0.15",
    "pre-commit>=4.0,<5",
    # TestClient de starlette. Desde starlette 1.3 intenta importar `httpx2` y,
    # si no está, cae a `httpx` con un StarletteDeprecationWarning; en una
    # versión futura dejará de caer. `httpx2` es un paquete APARTE (no una
    # actualización de httpx), así que convive con el `httpx` de producción y
    # de los SDKs sin forzar a nadie a subir de versión.
    "httpx2>=2.9,<3",
]

[tool.uv]
# El repo se ejecuta desde la raíz (`uvicorn backend.main:app`), NO se instala
# `backend/` como wheel. `package = false` hace que `uv sync` solo resuelva e
# instale las dependencias en .venv; `backend` es importable por estar en la
# raíz del proyecto (cwd), que es como ya se ejecutaba.
package = false

# ---------------------------------------------------------------------------
# Ruff — lint + formato (sustituye a black/isort/flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# El frontend tiene su propio linter (oxlint); ruff solo mira Python.
extend-exclude = ["frontend-react", ".venv"]

[tool.ruff.lint]
# E/F: errores y pyflakes · I: orden de imports · UP: pyupgrade ·
# B: bugbear (fallos sutiles) · SIM: simplificaciones.
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 (línea larga) lo gestiona el formateador para el código; los comentarios
# didácticos largos de este repo se dejan como están a propósito.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "evals"]

[tool.ruff.lint.flake8-bugbear]
# Los "defaults" de FastAPI (Depends/File/Form/...) son llamadas en la firma A
# PROPÓSITO: es el patrón idiomático de inyección de dependencias del framework,
# no el antipatrón que B008 persigue. Se permiten explícitamente.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

# ---------------------------------------------------------------------------
# Pytest + cobertura
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
show_missing = true
# En H1 NO se fija un umbral GLOBAL: se testean solo funciones puras (ver
# docs/H1-andamiaje.md §3), así que el resto del backend queda sin cubrir a
# propósito. El objetivo ≥80 % aplica a los módulos de funciones puras y se
# verifica por informe, no como puerta global (que llegará con más tests).
