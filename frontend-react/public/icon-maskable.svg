<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Variante MASKABLE del isotipo, para el icono de la app en Android.
    Dos diferencias con favicon.svg, y las dos son obligatorias:
      · Fondo a sangre, SIN esquinas redondeadas: el launcher recorta el icono a
        su propia forma (círculo, cuadrado, gota…), y unas esquinas transparentes
        se verían como mordiscos cuando la máscara es cuadrada.
      · La marca va a escala 2.4 en vez de 2.9, es decir 288px de 512 (56%), para
        caber holgada en la ZONA SEGURA (el círculo central del 80% = 410px), que
        es lo único que ninguna máscara llega a recortar.
    De aquí sale icon-maskable-512.png; el .svg se conserva como fuente editable.
  -->
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="holoV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="16%" r="115%">
      <stop offset="0" stop-color="#1b1055"/>
      <stop offset="0.6" stop-color="#0a0628"/>
      <stop offset="1" stop-color="#050318"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <!-- resplandor del proyector -->
  <circle cx="256" cy="272" r="150" fill="#38bdf8" opacity="0.20"/>
  <!-- isotipo PORTAL-MUNDO (markA 0..120), centrado y a escala de zona segura -->
  <g transform="translate(256 256) scale(2.4) translate(-60 -60)">
    <polygon points="60,7 105,33 105,87 60,113 15,87 15,33" fill="none" stroke="url(#holo)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="29" fill="none" stroke="url(#holo)" stroke-width="4.5"/>
    <ellipse cx="60" cy="60" rx="11.5" ry="29" fill="none" stroke="url(#holoV)" stroke-width="3"/>
    <line x1="31.5" y1="60" x2="88.5" y2="60" stroke="url(#holo)" stroke-width="3"/>
    <polygon points="60,25 67,60 60,95 53,60" fill="#fbbf24"/>
    <polygon points="25,60 60,53 95,60 60,67" fill="#fbbf24" opacity="0.45"/>
  </g>
</svg>
