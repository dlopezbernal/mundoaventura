<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="t d">
<title id='t'>Latencia percibida del chat antes y después del streaming</title>
<desc id='d'>Con streaming el niño empieza a leer a los 0,92 s (p50) en vez de esperar unos 3,9 s sin ver nada.</desc>
<rect width="780" height="380" fill="#fcfcfb"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="30" y="30" font-size="17" font-weight="700" fill="#0b0b0b">El streaming no acelera la respuesta: adelanta lo que se ve</text>
<text x="30" y="49" font-size="12.5" fill="#52514e">Medido sobre 15 corridas reales · barra = mediana (p50) · marca clara = p95</text>
<line x1="300.0" y1="66" x2="300.0" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="300.0" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">0 s</text>
<line x1="366.7" y1="66" x2="366.7" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="366.7" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">1 s</text>
<line x1="433.3" y1="66" x2="433.3" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="433.3" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">2 s</text>
<line x1="500.0" y1="66" x2="500.0" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="500.0" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">3 s</text>
<line x1="566.7" y1="66" x2="566.7" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="566.7" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">4 s</text>
<line x1="633.3" y1="66" x2="633.3" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="633.3" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">5 s</text>
<line x1="700.0" y1="66" x2="700.0" y2="286" stroke="#e3e2df" stroke-width="1"/>
<text x="700.0" y="302" font-size="11.5" text-anchor="middle" fill="#52514e">6 s</text>
<rect x="300.0" y="66.0" width="371.3" height="26" rx="4" fill="#eb6834" opacity="0.22"/>
<rect x="300.0" y="66.0" width="258.7" height="26" rx="4" fill="#eb6834"/>
<text x="288" y="83.5" font-size="12.5" text-anchor="end" fill="#0b0b0b">Antes · el niño no veía nada hasta aquí</text>
<text x="679.3" y="83.5" font-size="12.5" font-weight="700" fill="#0b0b0b">3,88 s</text>
<rect x="300.0" y="122.0" width="78.7" height="26" rx="4" fill="#2a78d6" opacity="0.22"/>
<rect x="300.0" y="122.0" width="61.3" height="26" rx="4" fill="#2a78d6"/>
<text x="288" y="139.5" font-size="12.5" text-anchor="end" fill="#0b0b0b">Ahora · empieza a leer</text>
<text x="386.7" y="139.5" font-size="12.5" font-weight="700" fill="#0b0b0b">0,92 s</text>
<rect x="300.0" y="178.0" width="191.3" height="26" rx="4" fill="#2a78d6" opacity="0.22"/>
<rect x="300.0" y="178.0" width="153.3" height="26" rx="4" fill="#2a78d6"/>
<text x="288" y="195.5" font-size="12.5" text-anchor="end" fill="#0b0b0b">Ahora · empieza a oír</text>
<text x="499.3" y="195.5" font-size="12.5" font-weight="700" fill="#0b0b0b">2,30 s</text>
<rect x="300.0" y="234.0" width="371.3" height="26" rx="4" fill="#2a78d6" opacity="0.22"/>
<rect x="300.0" y="234.0" width="258.7" height="26" rx="4" fill="#2a78d6"/>
<text x="288" y="251.5" font-size="12.5" text-anchor="end" fill="#0b0b0b">Ahora · respuesta y voz completas</text>
<text x="679.3" y="251.5" font-size="12.5" font-weight="700" fill="#0b0b0b">3,88 s</text>
<line x1="300" y1="66" x2="300" y2="286" stroke="#52514e" stroke-width="1.5"/>
<text x="30" y="346" font-size="11" fill="#52514e">Fuente: docs/mediciones/H8-latencia-streaming.md (n=15, Groq Llama-3.3-70B + ElevenLabs Flash).</text>
<text x="30" y="362" font-size="11" fill="#52514e">La fila «Antes» no es una medición del sistema antiguo: es el TOTAL medido hoy, que es lo que se esperaba en blanco sin streaming.</text>
</g>
</svg>