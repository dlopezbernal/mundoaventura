name: CI

# Corre en cada push y en cada pull request contra dev (y main).
# `workflow_dispatch` añade el botón "Run workflow" de la interfaz de GitHub,
# para poder redesplegar a mano sin inventarse un commit vacío.
#
# `paths-ignore`: un cambio que SOLO toca documentación no arranca nada. No es
# tacañería, es que ejecutar pytest y `npm run build` para corregir una tabla de
# Markdown no comprueba nada: la rama `docs/congelacion-tribunal` llegó a gastar
# cuatro corridas completas sin una sola línea de código. Basta con que el commit
# toque UN fichero fuera de la lista para que el CI vuelva a correr entero, así
# que un cambio mixto (código + documentación) se verifica como siempre.
# Consecuencia que hay que conocer: un merge a `main` de solo documentación
# tampoco despliega, y el servidor se queda con el árbol anterior hasta el
# siguiente despliegue de verdad. Es inofensivo —la app no sirve los `.md`— pero
# explica por qué a veces `git log` en el VPS va un commit por detrás.
on:
  push:
    branches: [dev, main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [dev, main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Solo interesa el ÚLTIMO commit de una rama: si se empujan tres seguidos, los
# dos primeros ya no se van a mirar. Sin esto, cada `git push` de corrección
# durante una revisión deja corriendo una verificación que nadie leerá.
#
# `cancel-in-progress` se apaga a propósito en `main`: ahí la corrida termina en
# el job de despliegue, y abortarlo a mitad dejaría el servidor en un estado
# intermedio (a medio `git pull` o a medio `npm run build`). En `main` se espera;
# en todo lo demás, se cancela.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# SIN TRABAJO DUPLICADO. Con los dos disparadores de arriba, un PR de `dev` a
# `main` verificaba dos veces el MISMO commit: una al empujarlo a `dev` (evento
# push) y otra entera como PR. Se nota sobre todo cuando GitHub va lento —checks
# "pendientes" en el PR que ya estaban en verde en el otro run— y gasta el doble
# de minutos.
#
# De ahí el `if` que llevan los dos trabajos de verificación: se saltan SOLO
# cuando el PR viene de `dev` o `main`, que son las ramas que ya disparan el CI
# por push. Un PR desde cualquier otra rama (`feat/…`, `fix/…`) sigue
# verificándose —ahí el PR es la única red que hay— y un push directo a `dev` o
# `main` también.
#
# Va repetido en los dos trabajos a propósito: `jobs.<id>.if` NO puede leer el
# contexto `env`, así que no hay forma de declarar la condición una sola vez.
# Si la quitas de uno solo, ese trabajo vuelve a duplicarse en silencio.
jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !contains(fromJSON('["dev", "main"]'), github.head_ref)
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Instalar Python (según .python-version) y dependencias
        # --frozen: instala EXACTAMENTE lo del uv.lock (falla si el lock está
        # desincronizado con pyproject.toml). Es la garantía de reproducibilidad.
        run: uv sync --frozen

      - name: Ruff · lint
        run: uv run ruff check backend/ tests/ evals/

      - name: Ruff · formato
        run: uv run ruff format --check backend/ tests/ evals/

      - name: Pytest · con cobertura
        run: uv run pytest --cov=backend --cov-report=term-missing

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    # Mismo `if` que en `backend`: ver la nota de arriba (no se puede factorizar).
    if: github.event_name != 'pull_request' || !contains(fromJSON('["dev", "main"]'), github.head_ref)
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  deploy:
    name: Desplegar a producción
    # `needs` es la garantía de que NUNCA se despliega algo con el CI en rojo:
    # este job ni siquiera empieza si backend o frontend fallan.
    needs: [backend, frontend]
    # Solo main = producción. Un push a dev pasa el CI pero no toca el servidor.
    # Cubre a la vez el push a main y el "Run workflow" manual desde esa rama.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Runner AUTOALOJADO: el propio VPS pide trabajo a GitHub y despliega desde
    # dentro. Antes esto era un `ssh` desde un runner de GitHub, lo que obligaba
    # a tener el puerto 22 abierto a internet y una clave privada del servidor
    # guardada en los secretos del repositorio. Ahora no hace falta ninguna de
    # las dos cosas: la conexión la abre el servidor, hacia fuera.
    #
    # `self-hosted` + la etiqueta del despliegue, para que si algún día hay más
    # de un runner el trabajo caiga en el correcto. Los dos trabajos de
    # verificación siguen en los runners de GitHub A PROPÓSITO: son 2 vCPU y 4 GB
    # compartidos con la app en producción, y no conviene que un `npm run build`
    # de un PR compita por la memoria con el backend que está sirviendo a un niño.
    runs-on: [self-hosted, linux, despliegue]
    # Dos merges seguidos NO pueden desplegar a la vez: el segundo espera. Sin
    # esto, dos `git pull` + `npm run build` simultáneos sobre el mismo
    # directorio del servidor se pisarían a mitad.
    # cancel-in-progress: false → nunca se aborta un despliegue ya empezado, que
    # es justo cuando el servidor está en un estado intermedio.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    # Registra el despliegue en la pestaña Environments de GitHub (con su
    # historial) y permite exigir aprobación manual añadiendo un revisor.
    environment:
      name: produccion
      url: https://chatmundoaventura.com
    steps:
      # NO se hace `checkout`. El árbol que se despliega lo trae el propio script
      # con su `git pull` sobre /opt/mundoaventura, que es la copia de trabajo de
      # verdad (con su .env, su SQLite y sus documentos). Clonar aquí solo
      # ensuciaría el directorio del runner con una copia que nadie usa.
      - name: Desplegar
        # El runner corre como `gha-runner`, un usuario SIN acceso a la app: lo
        # único que puede hacer es invocar ESTE script como el dueño de la app,
        # porque así está acotado en /etc/sudoers.d/gha-runner (docs/DESPLIEGUE.md
        # §5.4). Es el equivalente al `command=` forzado que tenía la clave SSH:
        # da igual lo que diga el resto del workflow, aquí solo se despliega.
        #
        # El script vuelve atrás solo y sale con error si /health no responde, así
        # que el resultado de este paso es el resultado real del despliegue.
        #
        # `-H` no es opcional: sin él, sudo conserva el HOME de quien llama
        # (`/home/gha-runner`) y el script no encontraría `uv`, que vive en
        # `~/.local/bin` del usuario de la app. Falla en `uv sync` con un
        # "command not found" que no se explica solo.
        run: sudo -H -u mundoaventura /opt/mundoaventura/deploy/desplegar.sh

      - name: Comprobar el sitio público
        # El script ya valida /health por dentro (127.0.0.1). Esto verifica lo
        # otro: que Caddy, el certificado y el DNS siguen sirviendo la app a
        # quien la usa de verdad, desde fuera del servidor.
        run: |
          curl -fsS --max-time 20 https://chatmundoaventura.com/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS --max-time 20 -o /dev/null https://chatmundoaventura.com/
